<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Prototaxite, silhouette paléoart : haut tronc massif effilé (obélisque
       organique / termitière allongée), base évasée, amincissement continu vers
       une pointe douce, cannelures verticales / plis drapés découpés en blanc.
       Deux colonnes sœurs aux mêmes pointes.
       Tout en chemins REMPLIS (le rendu MSVG d'ImageMagick ignore les strokes). -->
  <g fill="black">
    <!-- tronc principal -->
    <path d="M 150 492 C 186 484 196 462 199 424 C 204 345 211 230 224 132 C 229 88 239 48 250 38 C 261 48 271 88 276 132 C 289 230 296 345 301 424 C 304 462 314 484 350 492 Z"/>
    <!-- colonne soeur gauche -->
    <path d="M 44 492 C 66 486 74 468 77 438 C 80 398 84 340 90 296 C 93 262 97 240 101 236 C 105 240 109 262 112 296 C 118 340 122 398 125 438 C 128 468 136 486 158 492 Z"/>
    <!-- colonne soeur droite -->
    <path d="M 350 492 C 368 488 375 472 377 448 C 380 415 383 365 388 330 C 390 308 395 292 399 289 C 403 292 408 308 410 330 C 415 365 418 415 421 448 C 423 472 430 488 447 492 Z"/>
  </g>
  <g fill="white">
    <!-- cannelures verticales du tronc (plis drapés) -->
    <path d="M 240 115 C 233 220 228 340 226 452 C 230 457 237 457 240 452 C 242 340 248 220 253 122 C 249 112 243 109 240 115 Z"/>
    <path d="M 263 210 C 266 290 269 390 271 452 C 268 457 261 457 258 452 C 257 390 256 290 254 216 C 256 207 261 203 263 210 Z"/>
    <!-- cannelures des colonnes soeurs -->
    <path d="M 97 298 C 95 355 92 415 91 453 C 94 459 102 459 105 453 C 105 415 106 355 108 304 C 105 295 99 292 97 298 Z"/>
    <path d="M 400 334 C 401 377 403 420 404 450 C 401 456 393 456 392 450 C 391 420 390 377 389 338 C 390 330 397 328 400 334 Z"/>
  </g>
</svg>
