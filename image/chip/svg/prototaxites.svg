    <!-- colonne principale -->
    <path d="M 168 492 C 196 482 206 456 208 422 L 210 130 C 210 82 227 48 250 48 C 273 48 290 82 290 130 L 292 422 C 294 456 304 482 332 492 Z"/>
    <!-- colonne soeur gauche -->
    <path d="M 60 492 C 78 485 87 466 88 442 L 90 268 C 90 238 98 220 110 220 C 122 220 130 238 130 268 L 132 442 C 133 466 137 485 155 492 Z"/>
    <!-- colonne soeur droite -->
    <path d="M 348 492 C 366 486 374 470 375 448 L 377 326 C 377 298 383 282 393 282 C 403 282 409 298 409 326 L 411 448 C 412 470 420 486 438 492 Z"/>
  </g>
  <g fill="white">
