<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Prototaxite : haute colonne fongique fuselée, base évasée, deux colonnes sœurs.
       Tout en chemins REMPLIS (le rendu MSVG d'ImageMagick ignore les strokes). -->
