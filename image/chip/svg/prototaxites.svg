    <path d="M 222 132 Q 250 146 278 132 L 278 146 Q 250 160 222 146 Z"/>
    <path d="M 221 210 Q 250 224 279 210 L 279 224 Q 250 238 221 224 Z"/>
    <path d="M 220 288 Q 250 302 280 288 L 280 302 Q 250 316 220 302 Z"/>
    <path d="M 219 366 Q 250 380 281 366 L 281 380 Q 250 394 219 380 Z"/>
    <!-- anneaux des colonnes soeurs -->
    <path d="M 99 290 Q 110 300 121 290 L 121 302 Q 110 312 99 302 Z"/>
    <path d="M 98 362 Q 110 372 122 362 L 122 374 Q 110 384 98 374 Z"/>
    <path d="M 384 348 Q 393 357 402 348 L 402 359 Q 393 368 384 359 Z"/>
    <path d="M 385 412 Q 393 420 401 412 L 401 423 Q 393 431 385 423 Z"/>
    <!-- reflet du sommet, comme les éclats blancs des autres glyphes -->
    <path d="M 228 70 C 232 62 240 60 242 66 C 244 72 238 92 234 100 C 230 108 222 108 221 101 C 220 92 224 78 228 70 Z"/>
  </g>
</svg>
